name: Build and deploy site

# Runs on every push to main, including saves from the admin page.
# It rebuilds the pages from data/, checks links and images, tests the admin
# service, then publishes to GitHub Pages.
# Needs: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build pages from data
        run: python3 tools/build_site.py
      - name: Check links and images
        run: python3 tools/check_site.py
      - name: Test admin service
        run: |
          python3 tools/bundle_admin.py
          node --test admin/test/worker.test.mjs
      - name: Collect the public files
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'admin' --exclude 'tools' --exclude 'docs' --exclude '_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
